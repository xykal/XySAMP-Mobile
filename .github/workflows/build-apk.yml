name: Build XySAMP Official Signed APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      server_host:
        description: "IP / Domain Server SA-MP"
        required: false
        default: "play.xyverse.my.id"
        type: string
      server_port:
        description: "Port UDP Server SA-MP"
        required: false
        default: "7777"
        type: string
      client_tag:
        description: "Tag Versi Client (kosongin = pakai PROD_CLIENT_TAG dari Secrets)"
        required: false
        default: ""
        type: string
      default_nick:
        description: "Nickname default (tanpa spasi)"
        required: false
        default: "Warga_XyVerse"
        type: string
      app_name:
        description: "Nama Aplikasi di HP"
        required: false
        default: "XySAMP Mobile"
        type: string
      brand_name:
        description: "Nama Brand / Server di Launcher"
        required: false
        default: "XyVerse Roleplay"
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Official Signed + R8 Hardened APK (Restricted to xykal)
    # HANYA jalan kalau dijalankan oleh owner (xykal) atau pemegang token xykal di repo asli
    if: github.repository == 'xykal/XySAMP-Mobile' && github.actor == 'xykal'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Verifikasi Otorisasi Owner & Token
        env:
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          if [ "${GITHUB_ACTOR}" != "xykal" ] || [ "${GITHUB_REPOSITORY}" != "xykal/XySAMP-Mobile" ]; then
            echo "::error::Akses ditolak: Workflow ini hanya boleh dijalankan oleh xykal / pemegang token resmi."
            exit 1
          fi
          if [ "${HAS_KEYSTORE}" != "true" ]; then
            echo "::error::Official Keystore Secret (KEYSTORE_BASE64) tidak ditemukan."
            exit 1
          fi
          echo "Otorisasi valid: Actor=${GITHUB_ACTOR}"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Inject Production Secrets, XOR Obfuscation, Cert Pinning & R8 Config
        env:
          SECRET_TAG: ${{ secrets.PROD_CLIENT_TAG }}
          SECRET_KEY: ${{ secrets.PROD_HANDSHAKE_KEY }}
          SECRET_CERT: ${{ secrets.CERT_SHA256 }}
          IN_HOST: ${{ inputs.server_host }}
          IN_PORT: ${{ inputs.server_port }}
          IN_TAG: ${{ inputs.client_tag }}
          IN_NICK: ${{ inputs.default_nick }}
          IN_APP: ${{ inputs.app_name }}
          IN_BRAND: ${{ inputs.brand_name }}
        run: |
          HOST="${IN_HOST:-play.xyverse.my.id}"
          PORT="${IN_PORT:-7777}"
          TAG="${IN_TAG:-${SECRET_TAG:-XYSAMP-1.0}}"
          NICK="${IN_NICK:-Warga_XyVerse}"
          KEY="${SECRET_KEY:-0x9F4E7C2B}"
          CERT="${SECRET_CERT:-93fa85c2c42e17125bb66adbeab49fa3ccfcee646429aeb5078bdc322ea9341c}"
          APP="${IN_APP:-XySAMP Mobile}"
          BRAND="${IN_BRAND:-XyVerse Roleplay}"

          python3 tools/lockdown.py \
            --repo . \
            --host "$HOST" \
            --port "$PORT" \
            --tag "$TAG" \
            --name "$NICK" \
            --key "$KEY" \
            --cert-sha256 "$CERT" \
            --app-name "$APP" \
            --brand "$BRAND" \
            --strip-firebase

      - name: Setup Android SDK 36 & NDK 26.2.11394342
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Load Official Release Keystore ke RAM (/dev/shm)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 --decode > /dev/shm/xysamp-official.jks
          chmod 600 /dev/shm/xysamp-official.jks
          echo "KEYSTORE_FILE=/dev/shm/xysamp-official.jks" >> $GITHUB_ENV

      - name: Build Official Signed + R8 Minified Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Hapus Keystore dari RAM (Anti-Leak)
        if: always()
        run: |
          shred -u /dev/shm/xysamp-official.jks 2>/dev/null || rm -f /dev/shm/xysamp-official.jks

      - name: Verifikasi Signature APK Resmi (apksigner)
        run: |
          APK_FILE=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs -v "$APK_FILE"
          mkdir -p dist-paket
          cp "$APK_FILE" dist-paket/XySAMP-Mobile-Official-Signed.apk
          ls -lh dist-paket/

      - name: Upload Artifact Resmi (Hanya APK Signed, Keystore Tidak Di-expose)
        uses: actions/upload-artifact@v4
        with:
          name: XySAMP-Mobile-Official-Signed-APK
          path: dist-paket/XySAMP-Mobile-Official-Signed.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish ke GitHub Releases (jika push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-paket/XySAMP-Mobile-Official-Signed.apk
          generate_release_notes: true
