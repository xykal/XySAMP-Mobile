name: Build Lombok Holiday v2.1.0 Official Signed APKs (Per-ABI Split)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      server_host:
        description: "IP / Domain Server SA-MP"
        required: false
        default: "play.lombokholiday.my.id"
        type: string
      server_port:
        description: "Port UDP Server SA-MP"
        required: false
        default: "7777"
        type: string
      client_tag:
        description: "Tag versi client (maks 24 karakter; default LOMBOKHOLIDAY-2.1)"
        required: false
        default: ""
        type: string
      default_nick:
        description: "Nickname default (tanpa spasi)"
        required: false
        default: "Warga_Lombok"
        type: string
      app_name:
        description: "Nama Aplikasi di HP"
        required: false
        default: "Lombok Holiday"
        type: string
      brand_name:
        description: "Nama Brand / Server di Launcher"
        required: false
        default: "Lombok Holiday Roleplay"
        type: string
      package_id:
        description: "Package Name Android (applicationId)"
        required: false
        default: "com.lombokholiday.mobile"
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Lombok Holiday Signed Split APKs (arm64-v8a & armeabi-v7a)
    if: github.repository == 'xykal/XySAMP-Mobile' && github.actor == 'xykal'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Verifikasi Otorisasi Owner & Token
        env:
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
          HAS_HANDSHAKE_KEY: ${{ secrets.PROD_HANDSHAKE_KEY != '' }}
        run: |
          if [ "${GITHUB_ACTOR}" != "xykal" ] || [ "${GITHUB_REPOSITORY}" != "xykal/XySAMP-Mobile" ]; then
            echo "::error::Akses ditolak: Workflow ini hanya boleh dijalankan oleh xykal / pemegang token resmi."
            exit 1
          fi
          if [ "${HAS_KEYSTORE}" != "true" ]; then
            echo "::error::Official Keystore Secret (KEYSTORE_BASE64) tidak ditemukan."
            exit 1
          fi
          if [ "${HAS_HANDSHAKE_KEY}" != "true" ]; then
            echo "::error::PROD_HANDSHAKE_KEY Secret wajib diatur; key tidak lagi punya fallback plaintext."
            exit 1
          fi
          echo "Otorisasi valid: Actor=${GITHUB_ACTOR}"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Inject Production Secrets, XOR Obfuscation, Cert Pinning & R8 Config
        env:
          SECRET_KEY: ${{ secrets.PROD_HANDSHAKE_KEY }}
          SECRET_CERT: ${{ secrets.CERT_SHA256 }}
          IN_HOST: ${{ inputs.server_host }}
          IN_PORT: ${{ inputs.server_port }}
          IN_TAG: ${{ inputs.client_tag }}
          IN_NICK: ${{ inputs.default_nick }}
          IN_APP: ${{ inputs.app_name }}
          IN_BRAND: ${{ inputs.brand_name }}
          IN_PKG: ${{ inputs.package_id }}
        run: |
          HOST="${IN_HOST:-play.lombokholiday.my.id}"
          PORT="${IN_PORT:-7777}"
          TAG="${IN_TAG:-LOMBOKHOLIDAY-2.1}"
          NICK="${IN_NICK:-Warga_Lombok}"
          KEY="${SECRET_KEY}"
          if [ -z "$KEY" ]; then echo "::error::PROD_HANDSHAKE_KEY missing"; exit 1; fi
          CERT="${SECRET_CERT:-93fa85c2c42e17125bb66adbeab49fa3ccfcee646429aeb5078bdc322ea9341c}"
          APP="${IN_APP:-Lombok Holiday}"
          BRAND="${IN_BRAND:-Lombok Holiday Roleplay}"
          PKG="${IN_PKG:-com.lombokholiday.mobile}"

          python3 tools/lockdown.py \
            --repo . \
            --host "$HOST" \
            --port "$PORT" \
            --tag "$TAG" \
            --name "$NICK" \
            --key "$KEY" \
            --cert-sha256 "$CERT" \
            --app-name "$APP" \
            --brand "$BRAND" \
            --package-id "$PKG" \
            --strip-firebase

      - name: Setup Android SDK 34/36 & NDK 26.2.11394342
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;35.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

      - name: Build MonetLoader 3.8.0 from pinned GPLv3 source for both ABIs
        env:
          MONETLOADER_COMMIT: 9fa9fdb305634e6012734e7e10c38bb9bff2a9cd
        run: |
          set -euo pipefail
          ML_SRC="$RUNNER_TEMP/MonetLoaderOSS"
          mkdir -p "$ML_SRC"
          git -C "$ML_SRC" init -q
          git -C "$ML_SRC" remote add origin https://github.com/xefinity/MonetLoaderOSS.git
          git -C "$ML_SRC" fetch --depth 1 origin "$MONETLOADER_COMMIT"
          git -C "$ML_SRC" checkout --detach FETCH_HEAD
          test "$(git -C "$ML_SRC" rev-parse HEAD)" = "$MONETLOADER_COMMIT"
          cp "$ML_SRC/LICENSE" app/src/main/assets/MonetLoader-GPL-3.0.txt
          (cd "$ML_SRC" && zip -qr "$GITHUB_WORKSPACE/app/src/main/assets/monetloader-dist.zip" dist)
          NDK="$ANDROID_HOME/ndk/26.2.11394342"
          CMAKE="$ANDROID_HOME/cmake/3.22.1/bin/cmake"
          for ABI in arm64-v8a armeabi-v7a; do
            BUILD_DIR="$RUNNER_TEMP/monetloader-build-$ABI"
            "$CMAKE" -S "$ML_SRC" -B "$BUILD_DIR" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM=android-24 \
              -DCMAKE_BUILD_TYPE=Release
            "$CMAKE" --build "$BUILD_DIR" --target monetloader --parallel 2
            test -f "$BUILD_DIR/libmonetloader.so"
            mkdir -p "app/src/main/jniLibs/$ABI"
            cp "$BUILD_DIR/libmonetloader.so" "app/src/main/jniLibs/$ABI/libmonetloader.so"
            cp "$ML_SRC/lib/lua/bin/$ABI/shared_release/libluajit-5.1.so" "app/src/main/jniLibs/$ABI/libluajit-5.1.so"
          done

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Load Official Release Keystore ke RAM (/dev/shm)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 --decode > /dev/shm/xysamp-official.jks
          chmod 600 /dev/shm/xysamp-official.jks
          echo "KEYSTORE_FILE=/dev/shm/xysamp-official.jks" >> $GITHUB_ENV

      - name: Build Official Signed + R8 Minified Release APKs (Split per ABI)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Hapus Keystore dari RAM (Anti-Leak)
        if: always()
        run: |
          shred -u /dev/shm/xysamp-official.jks 2>/dev/null || rm -f /dev/shm/xysamp-official.jks

      - name: Verifikasi Signature Kedua APK Resmi (arm64-v8a & armeabi-v7a)
        run: |
          mkdir -p dist-paket
          ls -lh app/build/outputs/apk/release/
          for ABI in arm64-v8a armeabi-v7a; do
            SRC_APK="app/build/outputs/apk/release/app-${ABI}-release.apk"
            OUT_APK="dist-paket/LombokHoliday-${ABI}-Official-Signed.apk"
            if [ -f "$SRC_APK" ]; then
              $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs -v "$SRC_APK"
              cp "$SRC_APK" "$OUT_APK"
            fi
          done
          ls -lh dist-paket/

      - name: Upload R8 Mapping (untuk deobfuscasi crash log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LombokHoliday-R8-Mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload Artifact Resmi (arm64-v8a & armeabi-v7a Terpisah)
        uses: actions/upload-artifact@v4
        with:
          name: LombokHoliday-Official-Signed-APKs
          path: dist-paket/LombokHoliday-*-Official-Signed.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish ke GitHub Releases (jika push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-paket/LombokHoliday-arm64-v8a-Official-Signed.apk
            dist-paket/LombokHoliday-armeabi-v7a-Official-Signed.apk
            THIRD_PARTY_NOTICES.md
          generate_release_notes: true
